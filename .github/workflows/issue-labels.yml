name: Issue Labels

on:
  push:
    branches:
      - main
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/issue-labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Sync issue labels
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure managed issue labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const managedLabels = [
              {
                name: "bug",
                color: "d73a4a",
                description: "Something is broken or behaving incorrectly.",
              },
              {
                name: "enhancement",
                color: "a2eeef",
                description: "Requested improvement or new capability.",
              },
              {
                name: "needs-triage",
                color: "fbca04",
                description: "Issue needs maintainer review and initial categorization.",
              },
              {
                name: "agent-context-increase",
                color: "5319e7",
                description: "Permits an intentionally larger agent context budget.",
              },
              {
                name: "accepted",
                color: "0e8a16",
                description: "Maintainer/triage-approved work",
              },
              {
                name: "plusplus",
                color: "9333ea",
                description: "++ fork work",
              },
              {
                name: "upstream-candidate",
                color: "1d76db",
                description: "Change to propose upstream first.",
              },
              {
                name: "upstream-sync",
                color: "0052cc",
                description:
                  "Protected sync designation: maintainers/triage only; forces full CI and merge validation.",
              },
              {
                name: "plusplus-only",
                color: "7057ff",
                description: "Advisory: PR touches fork-owned code only; not an upstream proposal.",
              },
              {
                name: "seam",
                color: "006b75",
                description: "Advisory: PR touches a fork/upstream integration seam.",
              },
              {
                name: "sync-conflict",
                color: "b60205",
                description: "Advisory: PR touches fork-diverged files likely to conflict on upstream sync.",
              },
            ];

            for (const label of managedLabels) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                if (
                  existing.color !== label.color ||
                  (existing.description ?? "") !== label.description
                ) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }
