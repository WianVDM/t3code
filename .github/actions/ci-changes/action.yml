name: CI changes
description: Decide which CI jobs a change needs. See .github/scripts/ci-changes.cjs.
outputs:
  typecheck:
    value: ${{ steps.detect.outputs.typecheck }}
  build:
    value: ${{ steps.detect.outputs.build }}
  test:
    value: ${{ steps.detect.outputs.test }}
  test_packages:
    value: ${{ steps.detect.outputs.test_packages }}
  test_web:
    value: ${{ steps.detect.outputs.test_web }}
  test_server:
    value: ${{ steps.detect.outputs.test_server }}
  rust:
    value: ${{ steps.detect.outputs.rust }}
  release_smoke:
    value: ${{ steps.detect.outputs.release_smoke }}
  windows:
    value: ${{ steps.detect.outputs.windows }}
  windows_packages:
    value: ${{ steps.detect.outputs.windows_packages }}
  # "true" only when the fetch/diff fallback ran: detection was unhealthy, so
  # every gate is on but Check refuses to merge the run.
  fail_open:
    value: ${{ steps.detect.outputs.fail_open }}
  # Protected upstream-sync designation (#50): "true" forces the full run and
  # the sync merge job; sync_designation_error additionally fails Check.
  upstream_sync:
    value: ${{ steps.detect.outputs.upstream_sync }}
  sync_designation_error:
    value: ${{ steps.detect.outputs.sync_designation_error }}
runs:
  using: composite
  steps:
    # Resolves the upstream-sync claim before detection. An ordinary PR claims
    # nothing and never touches the network; a claimed PR resolves through the
    # timeline/permission proof in upstream-sync-pr.cjs, fail-closed to
    # "invalid" on any lookup error or resolver crash.
    - id: designation
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        if ! node .github/scripts/upstream-sync-pr.cjs --resolve-ci-designation >> "$GITHUB_OUTPUT"; then
          echo "sync=invalid" >> "$GITHUB_OUTPUT"
        fi

    - id: detect
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        SYNC: ${{ steps.designation.outputs.sync }}
      run: |
        set -uo pipefail

        case "$SYNC" in
          none|designated|invalid) ;;
          *) SYNC=invalid ;;
        esac

        decide() {
          node .github/scripts/ci-changes.cjs --sync "$SYNC" "$@" | tee -a "$GITHUB_OUTPUT"
          exit "${PIPESTATUS[0]}"
        }

        fail_open() {
          echo "$* Running every job; Check will fail because detection was unhealthy."
          echo "fail_open=true" >> "$GITHUB_OUTPUT"
          decide
        }

        # Reads the change from git rather than the REST API: every job that
        # runs this shares the repository's 1,000 requests/hour GITHUB_TOKEN quota.
        if [[ "$EVENT_NAME" == pull_request ]]; then
          # A pull request checks out GitHub's merge commit with fetch-depth: 2,
          # so its first parent is the base branch and the diff is the PR's change.
          base=HEAD^1
          mode=()
        else
          base=$BEFORE_SHA
          git fetch --quiet --no-tags --depth=1 --filter=blob:none origin "$base" \
            || fail_open "Could not fetch ${base}."
          # main keeps a full run as the backstop for anything the gate misses.
          mode=(--full)
        fi

        # --no-renames lists a rename as its old and new path: renaming a file out
        # of a package changes that package just like editing it. It also keeps
        # git from fetching file contents to score renames.
        git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed-paths" \
          || fail_open "Could not diff against ${base}."
        # A detector failure here fails the job; it never falls back healthy.
        echo "fail_open=false" >> "$GITHUB_OUTPUT"
        decide --paths "$RUNNER_TEMP/changed-paths" "${mode[@]}"
